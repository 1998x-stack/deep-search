[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-search-skill"
version = "0.1.0"
description = "Evidence-first deep research agent skill and auditable CLI"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "1998x-stack"}]
dependencies = []

[project.scripts]
deep-search = "deep_search.cli:main"

[tool.setuptools.packages.find]
include = ["deep_search*"]

