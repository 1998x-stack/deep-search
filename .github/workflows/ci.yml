name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Package installation
        run: python -m pip install -e .
      - name: Compile Python modules
        run: python -m compileall -q deep_search scripts tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate portable master research prompt
        run: python scripts/validate_master_prompt.py
      - name: Validate JSON files and canonical skills
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [*Path("schemas").glob("*.json"), *Path("evals").glob("*.json"), *Path("examples").glob("*.json")]:
              json.loads(path.read_text(encoding="utf-8"))
          skill = Path("SKILL.md").read_text(encoding="utf-8")
          assert skill.startswith("---\nname: deep-search\n")
          for path in (".agents/skills/deep-search/SKILL.md",
                       ".opencode/skills/deep-search/SKILL.md",
                       ".claude/skills/deep-search/SKILL.md"):
              assert Path(path).read_text(encoding="utf-8") == skill
          print("JSON and skill synchronization: OK")
          PY

