name: Factory CI
on:
  push:
    branches: ["factory/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q factory algorithms benchmarks scripts tests
      - name: Unit tests (zero live API calls)
        run: python -m unittest discover -s tests -v
      - name: Validate JSON and mirrored Skills
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          globs = [
              *Path("configs").glob("*.json"),
              *Path("configs").glob("**/*.json"),
              *Path("examples").glob("*.json"),
              *Path("fixtures").glob("*.json"),
          ]
          for path in globs:
              json.loads(path.read_text(encoding="utf-8"))
          canonical = Path("SKILL.md").read_text(encoding="utf-8")
          assert canonical.startswith("---\nname: deep-search-factory\n")
          for path in (".agents/skills/deep-search-factory/SKILL.md",
                       ".claude/skills/deep-search-factory/SKILL.md",
                       ".opencode/skills/deep-search-factory/SKILL.md"):
              assert Path(path).read_text(encoding="utf-8") == canonical
          print("JSON and Skill synchronization OK")
          PY
      - name: Reproducible offline benchmark
        run: python benchmarks/offline_eval.py --out runs/evals-ci
      - name: Strict-mode offline smoke
        run: |
          python algorithms/strict_research.py \
            --question "Fictional library test" \
            --provider mock --llm mock \
            --fixture examples/offline_fixture.json \
            --out runs/ci
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("runs/ci")
          assert json.loads((out / "audit.json").read_text())["valid"]
          assert json.loads((out / "run.json").read_text())["status"] == "completed"
          # Run-scoped loguru artifacts must exist and be machine-parsable.
          records = [json.loads(line) for line in
                     (out / "logs/run.jsonl").read_text(encoding="utf-8").splitlines() if line]
          assert records, "run.jsonl is empty"
          assert all(rec["record"]["extra"]["run_id"] != "-" for rec in records)
          stages = {rec["record"]["extra"]["stage"] for rec in records}
          assert {"init", "planning", "search", "evidence", "audit", "summary"} <= stages, stages
          assert (out / "logs/run.log").stat().st_size > 0
          print("Strict mock research completed with run logs")
          PY


  chromium-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional browser package
        run: python -m pip install -e '.[browser]'
      - name: Install Chromium and OS dependencies
        run: python -m playwright install --with-deps chromium
      - name: Offline real-browser DOM integration
        run: python -m unittest discover -s tests -p 'test_browser_integration.py' -v
